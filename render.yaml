# Render Blueprint: one API service and one dashboard service.
# Secret values (keys) are never stored here. Render asks for them when you create the Blueprint.
services:
  - type: web
    name: procureai-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Addresses: fill in after the first deploy (no trailing slash).
      - key: SERVER_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      # AI agent. Leave GEMINI_API_KEY empty to use the built-in scripted agent.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: AI_RUNS_PER_DAY
        value: "60"
      # Services. Leave empty to use the built-in mocks.
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Database: a free Neon Postgres is recommended (Render's own free Postgres expires after 30 days).
      # Without it, accounts and payments are lost whenever the free server sleeps.
      - key: DATABASE_URL
        sync: false
      # Accounts. Keep OTP in demo mode (code shown on screen): Render's free plan blocks SMTP, so Gmail cannot send from here.
      - key: OTP_DEMO_MODE
        value: "true"
      - key: DEMO_ACCOUNT
        value: "true"
      - key: AUTH_SECRET
        generateValue: true

  - type: web
    name: procureai-web
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API service URL (no trailing slash). Fill in after the first deploy, then redeploy this service.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # AG Studio licence key (free 45-day trial). Baked in at build time, so redeploy after changing it.
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE
        sync: false
